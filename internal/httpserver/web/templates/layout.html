{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Layout.PageTitle}}</title>
  <link rel="stylesheet" href="/static/bulma.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "icon-sprite" .}}
  <a href="#main-content" class="skip-link">Skip to content</a>
  {{template "app-shell" .}}
</body>
</html>
{{end}}

{{define "app-shell"}}
<div class="app-shell">
  <header data-app-header class="navbar app-header" role="banner">
    <div class="navbar-brand app-header-brand">
      <div class="is-hidden-desktop">
        {{template "mobile-sidebar" .Layout}}
      </div>
      {{template "brand" .}}
    </div>
  </header>
  <div class="app-body">
    {{template "sidebar" .Layout}}
    <div class="app-content">
      <main id="main-content" tabindex="-1" class="section app-section">
        <div class="container is-fluid page-container">
          {{template "page-content" .}}
        </div>
      </main>
    </div>
  </div>
</div>
{{end}}
