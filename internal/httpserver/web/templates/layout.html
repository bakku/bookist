{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Layout.PageTitle}}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "icon-sprite" .}}
  <a href="#main-content" class="skip-link">Skip to content</a>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <svg class="icon" aria-hidden="true"><use href="#icon-books"></use></svg>
        Bookist
      </a>
      <nav class="topnav" aria-label="Primary">
        {{range .Layout.PrimaryNav}}
        <a href="{{.Href}}"{{if .Active}} aria-current="page"{{end}}>{{.Label}}</a>
        {{end}}
      </nav>
      <form class="search" role="search" action="/">
        <label class="visually-hidden" for="q">Search the library</label>
        <input id="q" type="search" name="q" placeholder="Search title, author, ISBN">
        <button type="submit" aria-label="Search">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        </button>
      </form>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="page">
    <div class="container">
      {{template "page-content" .}}
    </div>
  </main>

  <footer class="footer">
    <div class="container">Bookist · Your home library</div>
  </footer>
</body>
</html>
{{end}}
